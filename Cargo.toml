[package]
name = "python"
version = "0.1.0"
edition = "2024"
description = "高速透明解密工具：零拷贝硬链接映射、内存流式剥壳、原生二进制管道校验落盘与默认递归目录解密。"
license = "MIT"
default-run = "python"

[lib]
name = "goodnice"
path = "src/lib.rs"

[[bin]]
name = "python"
path = "src/main.rs"

[[bin]]
name = "setup"
path = "src/bin/setup.rs"

[[bin]]
name = "uninstall"
path = "src/bin/uninstall.rs"

[[bin]]
name = "package"
path = "src/bin/package.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "wrap_help", "unicode"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"
